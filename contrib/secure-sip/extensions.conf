; Dialplan: outbound / inbound / internal / voicemail / emergency isolation.
; Caller ID is looked up from AstDB (cid/<ext>) populated by an admin, never
; taken from the client. Only Callcentric-verified numbers may be stored.

[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]
; Provisioned via: asterisk -rx "database put cid 1001 1777XXXXXXX"
DEFAULT_CID=1777XXXXXXX
TRUNK=PJSIP/callcentric
EMERGENCY_CID_EXT=1001

; ---- Caller ID enforcement (never trusts client-supplied CID) ----
[sub-set-cid]
exten => s,1,Set(CID_ALLOWED=${DB(cid/${ARG1})})
 same => n,GotoIf($["${CID_ALLOWED}" = ""]?default)
 same => n,Set(CALLERID(num)=${CID_ALLOWED})
 same => n,Set(CALLERID(name)=${DB(cidname/${ARG1})})
 same => n,Return()
 same => n(default),Set(CALLERID(num)=${DEFAULT_CID})
 same => n,Set(CALLERID(name)=)
 same => n,Return()

; ---- CDR for every attempt ----
[sub-log-attempt]
exten => s,1,Set(CDR(userfield)=${ARG1})
 same => n,Set(CDR(accountcode)=${CHANNEL(endpoint)})
 same => n,Return()

; ---- Emergency isolation: dedicated path, no CID rewrite loops/limits ----
[emergency]
exten => _911,1,Gosub(sub-log-attempt,s,1(EMERGENCY))
 same => n,Gosub(sub-set-cid,s,1(${CHANNEL(endpoint)}))
 same => n,Dial(${TRUNK}/${EXTEN},60,T)
 same => n,Hangup()
exten => _933,1,Dial(${TRUNK}/${EXTEN},60,T)
 same => n,Hangup()

[from-internal]
include => emergency
; Internal extension-to-extension (auth enforced by endpoint auth + ACL)
exten => _1XXX,1,Gosub(sub-log-attempt,s,1(INTERNAL))
 same => n,Set(CHANNEL(hangup_handler_push)=sub-log-attempt,s,1(INTERNAL-END))
 same => n,Dial(PJSIP/${EXTEN},30,Tt)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Voicemail(${EXTEN}@default,u)
 same => n(done),Hangup()
; Voicemail access
exten => *97,1,VoiceMailMain(${CALLERID(num)}@default,s)
 same => n,Hangup()
; Outbound US/Canada 10-digit
exten => _NXXNXXXXXX,1,Gosub(sub-log-attempt,s,1(OUTBOUND))
 same => n,Gosub(sub-set-cid,s,1(${CHANNEL(endpoint)}))
 same => n,Dial(${TRUNK}/1${EXTEN},60,Tt)
 same => n,Hangup()
; Outbound 11-digit
exten => _1NXXNXXXXXX,1,Gosub(sub-log-attempt,s,1(OUTBOUND))
 same => n,Gosub(sub-set-cid,s,1(${CHANNEL(endpoint)}))
 same => n,Dial(${TRUNK}/${EXTEN},60,Tt)
 same => n,Hangup()
; International
exten => _011.,1,Gosub(sub-log-attempt,s,1(OUTBOUND-INTL))
 same => n,Gosub(sub-set-cid,s,1(${CHANNEL(endpoint)}))
 same => n,Dial(${TRUNK}/${EXTEN},60,Tt)
 same => n,Hangup()
exten => i,1,Playback(invalid)
 same => n,Hangup()

[from-trunk]
; Inbound: only from the identified Callcentric endpoint; no anonymous inbound.
; DIDs must be provisioned: asterisk -rx "database put did 1777XXXXXXX 1001"
exten => _X.,1,Gosub(sub-log-attempt,s,1(INBOUND))
 same => n,Set(TARGET=${DB(did/${EXTEN})})
 same => n,GotoIf($["${TARGET}" = ""]?reject)
 same => n,GotoIf($["${PJSIP_DIAL_CONTACTS(${TARGET})}" = ""]?vm)
 same => n,Dial(PJSIP/${TARGET},30,Tt)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n(vm),Voicemail(${TARGET}@default,u)
 same => n(done),Hangup()
 same => n(reject),Hangup(1)
exten => i,1,Hangup(1)
