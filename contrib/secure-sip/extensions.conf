; Dialplan: outbound (Callcentric), inbound (trunk), internal, voicemail, CDR, emergency.
[general]
static=yes
writeprotect=yes

[globals]
; Caller ID is fixed to the verified Callcentric number; never user-settable.
TRUNK_CID=1777XXXXXXX
TRUNK_NAME=My Company
TRUNK_EP=callcentric

; Emergency calls are isolated and never rewritten or blocked by other rules
[emergency]
exten => 911,1,NoOp(EMERGENCY call from ${CHANNEL(endpoint)})
 same => n,Set(CALLERID(all)="${TRUNK_NAME}" <${TRUNK_CID}>)
 same => n,Dial(PJSIP/911@${TRUNK_EP},60)
 same => n,Hangup()

[outbound-cid]
; Enforce verified caller ID; overrides anything supplied by the client
exten => s,1,Set(CALLERID(all)="${TRUNK_NAME}" <${TRUNK_CID}>)
 same => n,Set(CALLERID(pres)=allowed_passed_screen)
 same => n,Return()

[from-internal]
include => emergency
exten => _1001,1,NoOp(Internal call to ${EXTEN} from ${CALLERID(num)})
 same => n,GotoIf($["${CHANNEL(endpoint)}"=""]?deny)
 same => n,Set(CDR(userfield)=internal)
 same => n,Dial(PJSIP/${EXTEN},25)
 same => n,Goto(vm,${EXTEN},1)
 same => n(deny),Hangup(21)

exten => _NXXNXXXXXX,1,Set(OUT=1${EXTEN})
 same => n,Goto(outbound,${OUT},1)
exten => _1NXXNXXXXXX,1,Set(OUT=${EXTEN})
 same => n,Goto(outbound,${OUT},1)
exten => _011.,1,Set(OUT=${EXTEN})
 same => n,Goto(outbound,${OUT},1)

[outbound]
exten => _X.,1,NoOp(Outbound ${EXTEN} from ${CHANNEL(endpoint)})
 same => n,GotoIf($["${CHANNEL(endpoint)}"!="1001"]?deny)
 same => n,Gosub(outbound-cid,s,1)
 same => n,Set(CDR(userfield)=outbound)
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK_EP},60)
 same => n,Hangup()
 same => n(deny),Hangup(21)

[from-trunk]
; Only identified Callcentric traffic reaches this context
exten => _X.,1,NoOp(Inbound ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(CDR(userfield)=inbound)
 same => n,GotoIf($["${PJSIP_DIAL_CONTACTS(1001)}"=""]?vm)
 same => n,Dial(PJSIP/1001,25)
 same => n(vm),Goto(vm,1001,1)

[vm]
exten => _X.,1,Answer()
 same => n,Wait(1)
 same => n,VoiceMail(${EXTEN}@default,u)
 same => n,Hangup()

[voicemail-access]
exten => *97,1,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()
