#!KAMAILIO
# Hardened stateful-transaction edge proxy: SessionTalk (TLS) -> Asterisk -> Callcentric
# Edit the defines below (or render with envsubst) before deployment.

# Example IPs: 203.0.113.50 = Asterisk, 203.0.113.51 = Kamailio. Replace all occurrences.
# Whitelist (Callcentric / SessionTalk networks) lives in /etc/kamailio/address.list (group 1).

####### Global parameters #########
debug=1
log_stderror=no
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "
fork=yes
children=8
tcp_connection_lifetime=3604
tcp_accept_no_cl=no
enable_tls=yes
auto_aliases=no
max_while_loops=100
server_header="Server: proxy"
user_agent_header="User-Agent: proxy"

listen=tls:203.0.113.51:5061
listen=udp:203.0.113.51:5060

####### Modules ########
loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "tls.so"
loadmodule "pike.so"
loadmodule "permissions.so"
loadmodule "dialog.so"
loadmodule "avpops.so"
loadmodule "nathelper.so"

# ----- module params -----
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)
modparam("tls", "config", "/etc/kamailio/tls.cfg")
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 20)
modparam("pike", "remove_latency", 4)
modparam("permissions", "address_file", "/etc/kamailio/address.list")
modparam("dialog", "dlg_flag", 4)
modparam("dialog", "timeout_avp", "$avp(i:30)")
modparam("dialog", "default_timeout", 14400)
modparam("dialog", "enable_stats", 1)
modparam("nathelper", "received_avp", "$avp(RECEIVED)")
modparam("ctl", "binrpc", "unix:/var/run/kamailio/kamailio_ctl")


####### Routing ########
request_route {
    # Per-request sanity
    route(REQINIT);
    # In-dialog requests
    route(WITHINDLG);
    # Initial requests: only the whitelisted methods
    if (!($rm =~ "^(INVITE|BYE|ACK|CANCEL|OPTIONS|REGISTER)$")) {
        xlog("L_WARN", "method not allowed: $rm from $si\n");
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }
    if (is_method("CANCEL")) {
        if (t_check_trans()) { t_relay(); }
        exit;
    }
    t_check_trans();
    route(ACL);
    route(SYMMETRIC);

    record_route();
    route(RELAY);
}

route[REQINIT] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");   # anti-loop
        exit;
    }
    if (!sanity_check("17895", "7")) {
        xlog("L_WARN", "malformed SIP message from $si:$sp\n");
        exit;
    }
    # Anti-recursion: never relay a request back to its own address
    if ($rd == "203.0.113.51" && ($rp == 5060 || $rp == 5061) && $rU == $null && !is_method("OPTIONS")) {
        sl_send_reply("482", "Loop Detected");
        exit;
    }
    # Flood protection
    if (!pike_check_req()) {
        xlog("L_WARN", "pike blocked $si\n");
        exit;
    }
    if (is_method("OPTIONS") && uri == myself && $rU == $null) {
        sl_send_reply("200", "OK");
        exit;
    }
}

route[ACL] {
    # Trusted sources: Asterisk, or configured address list (Callcentric/SessionTalk networks)
    if ($si == "203.0.113.50") { return; }
    if (check_source_address("1")) { return; }
    # Authenticated downstream clients arrive over TLS; Asterisk performs digest auth
    if ($proto == "tls") { return; }
    xlog("L_WARN", "ACL deny $si:$sp $rm\n");
    sl_send_reply("403", "Forbidden");
    exit;
}

route[SYMMETRIC] {
    # Reply to the real source (rport / received) for NAT'd mobile clients
    if (is_method("REGISTER|INVITE")) {
        force_rport();
        if (nat_uac_test("19")) {
            if (is_method("REGISTER")) { fix_nated_register(); }
            else { fix_nated_contact(); }
        }
    }
}

route[WITHINDLG] {
    if (!has_totag()) return;
    if (loose_route()) {
        if (is_method("BYE")) { setflag(1); }
        route(RELAY);
        exit;
    }
    if (is_method("ACK")) {
        if (t_check_trans()) { route(RELAY); exit; }
        exit;
    }
    sl_send_reply("404", "Not here");
    exit;
}

route[RELAY] {
    if (is_method("INVITE")) {
        dlg_manage();
        t_on_failure("MANAGE_FAILURE");
    }
    # Everything from Asterisk/trunk goes to clients via Request-URI; client traffic -> Asterisk
    if ($si != "203.0.113.50") {
        $du = "sip:203.0.113.50:5060";
    }
    t_on_reply("HANDLE_REPLY");
    if (!t_relay()) { sl_reply_error(); }
    exit;
}

onreply_route[HANDLE_REPLY] {
    if (status =~ "[12][0-9][0-9]") { force_rport(); }
}

failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) exit;
}
