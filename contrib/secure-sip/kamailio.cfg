#!KAMAILIO
# Stateless-first secure edge proxy: SessionTalk (TLS) -> Kamailio -> Asterisk (UDP 5060)
# Asterisk: 203.0.113.50  Kamailio: 203.0.113.51

#!define ASTERISK_IP "203.0.113.50"
#!define ASTERISK_URI "sip:203.0.113.50:5060"
#!define MAX_HOPS 10

####### Global ########
debug=1
log_stderror=no
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(Call-ID)} "
fork=yes
children=8
tcp_connection_lifetime=3605
tcp_accept_no_cl=yes
tcp_max_connections=2048
disable_tls=no
listen=udp:203.0.113.51:5060
listen=tls:203.0.113.51:5061
auto_aliases=no
server_header="Server: proxy"
user_agent_header="User-Agent: proxy"
max_while_loops=100

####### Modules ########
loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "pike.so"
loadmodule "htable.so"
loadmodule "dialog.so"
loadmodule "avpops.so"
loadmodule "nathelper.so"
loadmodule "permissions.so"
loadmodule "tls.so"

modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 20)
modparam("pike", "remove_latency", 4)
modparam("htable", "htable", "ipban=>size=8;autoexpire=300;")
modparam("dialog", "dlg_flag", 4)
modparam("dialog", "default_timeout", 7200)
modparam("dialog", "timeout_avp", "$avp(i:30)")
modparam("nathelper", "natping_interval", 30)
modparam("nathelper", "sipping_from", "sip:pinger@203.0.113.51")
modparam("permissions", "address_file", "/etc/kamailio/address.list")
modparam("tls", "config", "/etc/kamailio/tls.cfg")
modparam("ctl", "binrpc", "unixs:/var/run/kamailio/kamailio_ctl")

####### Routing ########
request_route {
    # Anti-loop / anti-recursion
    if (!mf_process_maxfwd_header(MAX_HOPS)) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if ($sht(ipban=>$si) != $null) { drop; exit; }
    if (!pike_check_req()) {
        xlog("L_WARN", "pike block $si\n");
        $sht(ipban=>$si) = 1;
        exit;
    }
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "malformed SIP from $si\n");
        exit;
    }
    # Loop detection: refuse looped requests
    if (is_method("INVITE") && $rd == "203.0.113.51" && $si != ASTERISK_IP && !allow_source_address("1")) {
        sl_send_reply("482", "Loop Detected");
        exit;
    }

    # Strict method filtering
    if (!is_method("INVITE|BYE|ACK|CANCEL|OPTIONS|REGISTER")) {
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }

    # IP ACL: Asterisk and Callcentric from address.list (group 1);
    # TLS clients (SessionTalk) may come from anywhere but must authenticate at Asterisk.
    if ($si != ASTERISK_IP && !allow_source_address("1") && $proto != "tls") {
        xlog("L_WARN", "ACL deny $si\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }

    # Symmetric signaling: reply to source, NAT-aware
    force_rport();
    if (nat_uac_test("19")) {
        if (is_method("REGISTER")) { fix_nated_register(); }
        else { fix_nated_contact(); }
        setflag(5);
    }

    if (is_method("OPTIONS") && uri == myself && $rU == $null) {
        sl_send_reply("200", "OK");
        exit;
    }

    if (has_totag()) {
        if (loose_route()) {
            if (is_method("BYE")) { setflag(4); }
            route(RELAY);
            exit;
        }
        if (is_method("ACK")) {
            if (t_check_trans()) { route(RELAY); }
            exit;
        }
        sl_send_reply("404", "Not Here");
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) { route(RELAY); }
        exit;
    }

    if (is_method("INVITE")) { setflag(4); record_route(); }

    # Route to Asterisk (it enforces digest auth, caller ID, dialplan)
    if ($si != ASTERISK_IP) {
        $du = ASTERISK_URI;
    }
    route(RELAY);
    exit;
}

route[RELAY] {
    if (!t_relay()) { sl_reply_error(); }
    exit;
}

onreply_route {
    if (nat_uac_test("1")) { fix_nated_contact(); }
}

failure_route[FAIL] {
    if (t_is_canceled()) exit;
}
