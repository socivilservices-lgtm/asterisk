# Kamailio TLS configuration (TLS 1.2+ only)
[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/kamailio/tls/kamailio.key
certificate = /etc/kamailio/tls/kamailio.crt
ca_list = /etc/kamailio/tls/ca.crt
cipher_list = ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
server_name_mode = 0

[client:default]
method = TLSv1.2+
verify_certificate = yes
require_certificate = no
private_key = /etc/kamailio/tls/kamailio.key
certificate = /etc/kamailio/tls/kamailio.crt
ca_list = /etc/kamailio/tls/ca.crt
cipher_list = ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
