# Install: split into /etc/fail2ban/filter.d/asterisk-sip.conf (the [Definition])
# and /etc/fail2ban/jail.d/asterisk-sip.local (the jails). Both sections shown here.

# ===== filter.d/asterisk-sip.conf =====
[Definition]
failregex = SECURITY.* SecurityEvent="(FailedACL|InvalidAccountID|ChallengeResponseFailed|InvalidPassword)".*RemoteAddress="IPV[46]/(UDP|TLS|TCP)/<HOST>/\d+"
            NOTICE.* <HOST> failed to authenticate as '[^']*'$
            NOTICE.* No registration for peer '[^']*' \(from <HOST>\)
            Request '[A-Z]+' from '[^']*' failed for '<HOST>:\d+'.*(No matching endpoint found|Failed to authenticate)
ignoreregex =

# ===== jail.d/asterisk-sip.local =====
[asterisk-sip]
enabled  = true
filter   = asterisk-sip
logpath  = /var/log/asterisk/security_log
           /var/log/asterisk/messages
backend  = auto
maxretry = 5
findtime = 600
bantime  = 86400
action   = nftables-allports[name=asterisk-sip, protocol=all]

[kamailio-sip]
enabled  = true
filter   = asterisk-sip
logpath  = /var/log/kamailio.log
maxretry = 5
findtime = 600
bantime  = 86400
action   = nftables-allports[name=kamailio-sip, protocol=all]
