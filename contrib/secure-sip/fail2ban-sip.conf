# Install: split into /etc/fail2ban/filter.d/asterisk-sip.conf (filter section)
# and /etc/fail2ban/jail.d/asterisk-sip.local (jail section).

# ---- filter.d/asterisk-sip.conf ----
[Definition]
failregex = SECURITY.* SecurityEvent="(FailedACL|InvalidAccountID|ChallengeResponseFailed|InvalidPassword)".*RemoteAddress="IPV[46]/(UDP|TLS|TCP)/<HOST>/\d+"
            NOTICE.* <HOST> failed to authenticate as
            NOTICE.* No registration for peer '.*' \(from <HOST>\)
ignoreregex =

# ---- jail.d/asterisk-sip.local ----
[asterisk-sip]
enabled  = true
filter   = asterisk-sip
backend  = auto
logpath  = /var/log/asterisk/security.log
           /var/log/asterisk/full
port     = 5060,5061
protocol = all
maxretry = 5
findtime = 600
bantime  = 3600
action   = nftables-allports[name=asterisk-sip]
ignoreip = 127.0.0.1/8 203.0.113.51
