; Secure PJSIP configuration: Asterisk 203.0.113.50, Kamailio 203.0.113.51
; Replace CHANGE_ME_* placeholders and 1777XXXXXXX with your verified Callcentric number.
; Do not commit real credentials. Prefer an include file with mode 0640.

[global]
type=global
user_agent=PBX
endpoint_identifier_order=ip,username,auth_username

[system]
type=system
timer_t1=500
timer_b=32000

; ---- Transports ----
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
ca_list_file=/etc/asterisk/keys/ca.crt
method=tlsv1_2
cipher=ECDHE-ECDSA-AES256-GCM-SHA384,ECDHE-RSA-AES256-GCM-SHA384,ECDHE-RSA-AES128-GCM-SHA256
verify_client=no
verify_server=yes
external_media_address=203.0.113.50
external_signaling_address=203.0.113.50
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

; Internal-only link to Kamailio
[transport-udp-internal]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---- ACLs ----
[acl-kamailio]
type=acl
deny=0.0.0.0/0.0.0.0
permit=203.0.113.51/32

; ---- Callcentric trunk ----
[callcentric-auth]
type=auth
auth_type=userpass
username=1777XXXXXXX
******

[callcentric-reg]
type=registration
transport=transport-tls
outbound_auth=callcentric-auth
server_uri=sip:callcentric.com
client_uri=sip:1777XXXXXXX@callcentric.com
contact_user=1777XXXXXXX
retry_interval=60
forbidden_retry_interval=600
expiration=600
max_retries=10

[callcentric-aor]
type=aor
contact=sip:callcentric.com
qualify_frequency=60

[callcentric]
type=endpoint
transport=transport-tls
context=from-trunk
disallow=all
allow=ulaw,alaw
outbound_auth=callcentric-auth
aors=callcentric-aor
from_domain=callcentric.com
from_user=1777XXXXXXX
send_pai=yes
trust_id_outbound=no
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=sdes
media_encryption_optimistic=no
timers=yes
timers_sess_expires=600
timers_min_se=90
allow_subscribe=no
;; Callcentric may not offer SRTP on all plans; if registration works but
;; calls fail with 488, check Callcentric SRTP support before relaxing.

[callcentric-id]
type=identify
endpoint=callcentric
match=callcentric.com
; Add Callcentric's published signaling networks here, e.g.:
;match=CALLCENTRIC_NET/CIDR

; ---- SessionTalk mobile extension 1001 ----
[1001-auth]
type=auth
auth_type=md5
username=1001
; Generate: echo -n "1001:asterisk:PASSWORD" | md5sum
md5_cred=CHANGE_ME_MD5_HASH
realm=asterisk

[1001]
type=aor
max_contacts=2
remove_existing=yes
remove_unavailable=yes
qualify_frequency=30
default_expiration=300
maximum_expiration=600
minimum_expiration=60

[1001]
type=endpoint
transport=transport-tls
context=from-internal
disallow=all
allow=ulaw,alaw
auth=1001-auth
aors=1001
callerid="Mobile 1001" <1001>
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
rtp_keepalive=15
media_encryption=sdes
media_encryption_optimistic=no
timers=yes
timers_sess_expires=600
timers_min_se=90
allow_subscribe=no
max_audio_streams=1
max_video_streams=0
send_pai=yes
trust_id_inbound=no
device_state_busy_at=1

; Apply acl-kamailio to endpoints reached only via the proxy by adding
; "acl=acl-kamailio" to that endpoint section.
