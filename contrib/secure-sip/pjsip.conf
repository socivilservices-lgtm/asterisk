; Secure PJSIP config: Callcentric trunk + SessionTalk ext 1001.
; Render with envsubst (see deployment-README.md). No secrets are stored here.
; Required vars: ASTERISK_PUBLIC_IP KAMAILIO_IP CC_NUMBER CC_PASSWORD
;                EXT1001_PASSWORD SESSIONTALK_NET CALLCENTRIC_NET

[global]
type=global
user_agent=PBX
max_forwards=20
endpoint_identifier_order=ip,username,auth_username

[system]
type=system
timer_t1=500
timer_b=32000
disable_tcp_switch=yes

; ---------- Transports ----------
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
external_signaling_address=${ASTERISK_PUBLIC_IP}
external_media_address=${ASTERISK_PUBLIC_IP}
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
ca_list_file=/etc/asterisk/keys/ca.crt
method=tlsv1_2
cipher=ECDHE-ECDSA-AES256-GCM-SHA384,ECDHE-RSA-AES256-GCM-SHA384,ECDHE-ECDSA-AES128-GCM-SHA256,ECDHE-RSA-AES128-GCM-SHA256
verify_client=no
verify_server=yes
require_client_cert=no

; UDP only reachable from Kamailio (enforced by nftables and ACL)
[transport-udp-kamailio]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_signaling_address=${ASTERISK_PUBLIC_IP}
external_media_address=${ASTERISK_PUBLIC_IP}

; ---------- ACLs ----------
[acl]
type=acl
deny=0.0.0.0/0.0.0.0
permit=${KAMAILIO_IP}
permit=${SESSIONTALK_NET}
permit=${CALLCENTRIC_NET}

; ---------- Callcentric trunk ----------
[callcentric-auth]
type=auth
auth_type=userpass
username=${CC_NUMBER}
password=${CC_PASSWORD}

[callcentric]
type=aor
contact=sip:callcentric.com:5060
qualify_frequency=60
qualify_timeout=3.0

[callcentric]
type=registration
transport=transport-udp-kamailio
outbound_auth=callcentric-auth
server_uri=sip:callcentric.com
client_uri=sip:${CC_NUMBER}@callcentric.com
contact_user=${CC_NUMBER}
retry_interval=60
forbidden_retry_interval=600
max_retries=10
expiration=300

[callcentric]
type=endpoint
context=from-trunk
disallow=all
allow=ulaw,alaw
outbound_auth=callcentric-auth
aors=callcentric
from_domain=callcentric.com
from_user=${CC_NUMBER}
trust_id_outbound=no
send_pai=no
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=sdes
media_encryption_optimistic=yes
dtmf_mode=rfc4733
timers=yes
timers_min_se=90
timers_sess_expires=1800

[callcentric]
type=identify
endpoint=callcentric
match=${CALLCENTRIC_NET}

; ---------- SessionTalk extension 1001 ----------
[1001]
type=auth
auth_type=userpass
username=1001
password=${EXT1001_PASSWORD}

[1001]
type=aor
max_contacts=2
remove_existing=yes
remove_unavailable=yes
qualify_frequency=30
minimum_expiration=60
maximum_expiration=600
default_expiration=300
support_path=yes
mailboxes=1001@default

[1001]
type=endpoint
transport=transport-tls
context=from-internal
disallow=all
allow=ulaw,alaw
auth=1001
aors=1001
callerid="Ext 1001" <1001>
acl=acl
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
rtp_keepalive=15
media_encryption=sdes
media_encryption_optimistic=no
use_avpf=no
ice_support=no
allow_subscribe=yes
dtmf_mode=rfc4733
timers=yes
timers_min_se=90
timers_sess_expires=1800
send_pai=no
trust_id_inbound=no
; Callers cannot choose their own identity; dialplan sets it
