#!/usr/sbin/nft -f
# Default-deny firewall for the Asterisk host. Adjust sets for your environment.
flush ruleset

table inet filter {
  set sessiontalk_ips {
    type ipv4_addr; flags interval;
    # Add SessionTalk / mobile client ranges, or leave open for TLS with auth:
    elements = { 0.0.0.0/0 }
  }
  set callcentric_ips {
    type ipv4_addr; flags interval;
    # Replace with Callcentric published signaling/media IPs
    elements = { 198.51.100.0/24 }
  }
  set kamailio { type ipv4_addr; elements = { 203.0.113.51 } }
  set admin_ips { type ipv4_addr; flags interval; elements = { 127.0.0.1 } }

  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
    ip6 nexthdr icmpv6 accept
    ip saddr @admin_ips tcp dport 22 ct state new limit rate 6/minute accept
    # TLS SIP
    ip saddr @sessiontalk_ips tcp dport 5061 ct state new limit rate 30/second accept
    ip saddr @callcentric_ips tcp dport 5061 accept
    ip saddr @callcentric_ips udp dport 5060 accept
    # UDP SIP from Kamailio only
    ip saddr @kamailio udp dport 5060 accept
    # RTP bidirectional
    udp dport 10000-20000 accept
    log prefix "nft-drop: " limit rate 5/minute drop
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output  { type filter hook output  priority 0; policy accept; }
}
