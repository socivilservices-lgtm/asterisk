#!/usr/sbin/nft -f
# Default-deny firewall for the Asterisk host.
# Replace the defines with your verified networks before loading.
flush ruleset

define ADMIN_IP       = 198.51.100.10          # your SSH source
define KAMAILIO_IP    = 203.0.113.51
define SESSIONTALK_NETS = { 198.51.100.0/24 }  # replace with SessionTalk/mobile egress ranges
define CALLCENTRIC_NETS = { 198.51.100.128/25 } # replace with Callcentric ranges from their docs

table inet filter {
    set sip_blacklist {
        type ipv4_addr
        flags timeout
    }

    chain input {
        type filter hook input priority 0; policy drop;

        iif lo accept
        ct state established,related accept
        ct state invalid drop
        ip saddr @sip_blacklist drop

        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
        ip6 nexthdr icmpv6 accept

        tcp dport 22 ip saddr $ADMIN_IP accept

        # SIP over TLS
        tcp dport 5061 ip saddr $SESSIONTALK_NETS ct state new limit rate 30/minute accept
        tcp dport 5061 ip saddr $CALLCENTRIC_NETS accept
        tcp dport 5061 ip saddr $KAMAILIO_IP accept

        # SIP over UDP: Kamailio and Callcentric (registration/trunk) only
        udp dport 5060 ip saddr $KAMAILIO_IP accept
        udp dport 5060 ip saddr $CALLCENTRIC_NETS accept

        # RTP/SRTP
        udp dport 10000-20000 accept

        log prefix "nft-drop: " level warn limit rate 5/minute
        drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;
        # Uncomment if this host routes for a private LAN:
        # oifname "eth0" masquerade
    }
}
