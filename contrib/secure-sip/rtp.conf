[general]
rtpstart=10000
rtpend=20000
rtpchecksums=yes
strictrtp=yes
rtpkeepalive=15
rtptimeout=60
rtpholdtimeout=300
icesupport=no
dtmftimeout=3000

; SRTP (SDES) is negotiated per-endpoint via media_encryption=sdes in pjsip.conf.
; Codec policy (ulaw/alaw only, no video) is enforced in pjsip.conf endpoints.
